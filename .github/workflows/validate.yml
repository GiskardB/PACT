name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save js-yaml
      - run: node scripts/validate-yaml-examples.mjs

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "*.md"
